<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Index by Ryan Gallimore, AI PM — Models, Concepts, Agentic AI & Roles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --text: #e8eaf0;
      --text-muted: #8892b0;
      --accent: #7c6af7;
      --accent-light: #a89df9;
      --green: #4ade80;
      --blue: #60a5fa;
      --orange: #fb923c;
      --pink: #f472b6;
      --yellow: #facc15;
      --radius: 12px;
      --transition: 0.18s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1d27 0%, #12152a 100%);
      border-bottom: 1px solid var(--border);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #a89df9, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.4rem;
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      max-width: 600px;
      margin: 0 auto 1.2rem;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1.1rem;
    }
    #search {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color var(--transition);
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text-muted); }

    /* ── Age Toggle ── */
    .age-toggle {
      display: inline-flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .age-toggle button {
      padding: 0.45rem 1.1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }
    .age-toggle button.active {
      background: var(--accent);
      color: #fff;
    }
    .age-label {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 0.4rem;
    }

    /* ── Category Filters ── */
    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }
    .filter-btn:hover { border-color: var(--accent-light); color: var(--accent-light); }
    .filter-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }

    /* ── Main Layout ── */
    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 4rem;
    }
    .results-count {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }

    /* ── Cards ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: border-color var(--transition), transform var(--transition);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
    .card-name { font-size: 1.05rem; font-weight: 600; }
    .card-name a { color: inherit; text-decoration: none; }
    .card-name a:hover { color: var(--accent-light); text-decoration: underline; text-underline-offset: 3px; }
    .cat-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cat-model    { background: rgba(124,106,247,0.18); color: var(--accent-light); }
    .cat-ml-type  { background: rgba(74,222,128,0.15);  color: var(--green); }
    .cat-arch     { background: rgba(96,165,250,0.15);  color: var(--blue); }
    .cat-concept  { background: rgba(251,146,60,0.15);  color: var(--orange); }
    .cat-role     { background: rgba(244,114,182,0.15); color: var(--pink); }
    .cat-cloud      { background: rgba(34,211,238,0.15);  color: #22d3ee; }
    .cat-challenge  { background: rgba(251,113,133,0.15); color: #fb7185; }
    .cat-prompt     { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .cat-business   { background: rgba(52,211,153,0.15);  color: #34d399; }
    .cat-smb        { background: rgba(163,230,53,0.15);  color: #a3e635; }
    .cat-pmconcern  { background: rgba(168,157,249,0.18); color: var(--accent-light); }
    .cat-consult    { background: rgba(45,212,191,0.15);  color: #2dd4bf; }

    .card-summary { color: var(--text-muted); font-size: 0.85rem; }
    .tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
    }
    .explanation {
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--text);
      line-height: 1.65;
    }
    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 4rem;
      font-size: 1rem;
      grid-column: 1/-1;
    }
  </style>
</head>

  // ── NEURAL NET ARCHITECTURES ───────────────────────────

    age45: "Transformers (Vaswani et al., 2017) replaced sequential RNNs with parallel self-attention, solving the vanishing gradient problem for long sequences. Encoder-only (BERT) for understanding; decoder-only (GPT) for generation; encoder-decoder (T5) for translation. Scaled via the scaling laws paper. The dominant architecture for NLP, vision (ViT), audio, and multi-modal tasks."

    age45: "CNNs exploit spatial locality and translation invariance via convolutional filters, pooling layers, and hierarchical feature extraction. Landmark architectures: LeNet, VGG, ResNet (skip connections), EfficientNet. Largely superseded by Vision Transformers (ViT) for large-scale tasks, but CNNs remain compute-efficient for edge/mobile deployment. Core skill for any ML engineer working on vision pipelines."

    age45: "GANs (Goodfellow et al., 2014) introduced adversarial training: G minimizes while D maximizes the same objective. Produced remarkable photorealism (StyleGAN, BigGAN) but suffer from training instability and mode collapse. Largely supplanted by diffusion models for image generation (2022+) due to better stability and diversity. Still used in video synthesis and specialized image-to-image translation."

    age45: "Diffusion models (DDPM, Rombach et al.) outperformed GANs on image quality and diversity (2021-2022). Key mechanism: learn the score function of the data distribution to denoise iteratively. Latent diffusion (Stable Diffusion) operates in compressed latent space — enabling training on consumer GPUs. Extended to audio (AudioLDM), video (Sora/Gen-2), and 3D generation. Now the dominant paradigm for generative media."

  {

    age45: "MoE replaces dense FFN layers with N expert sub-networks and a learned routing function (top-k gating). At inference, only k/N parameters are active per token, dramatically reducing FLOPs vs parameter count. Key examples: Mixtral 8x7B, GPT-4 (alleged), Gemini, and Meta's Llama 4 (Scout: 16 experts, Maverick: 128 experts). Key tradeoff: memory cost is high (all experts must fit in VRAM), but throughput and quality/FLOP ratio improve significantly."

  // ── KEY CONCEPTS ──────────────────────────────────────────
  {
    name: "Token / Tokenization", cat: "concept", tags: ["LLM","Input","Pricing","Context"],
    summary: "How text is broken into chunks that AI models can process — also the billing unit for LLM APIs",
    age10: "LLMs don't read word-by-word or letter-by-letter. They split text into 'tokens' — roughly 3-4 characters each. 'ChatGPT is cool' ≈ 5 tokens. Why? It's computationally efficient and handles new words better. API pricing is per token, so knowing token counts matters for cost management.",
    age45: "Tokenization (BPE, WordPiece, SentencePiece) converts text to integer IDs. ~1 token ≈ 0.75 English words; code tokenizes less efficiently. Critical for PMs: context window limits (128K-1M tokens) affect maximum document length; API cost = input + output tokens × price/1M. Token efficiency (prompt compression, caching) is a key LLM cost optimization lever."
  },
  {
    name: "Embedding", cat: "concept", tags: ["Vector","Semantic Search","RAG","Similarity"],
    summary: "A numerical representation of text (or images) that captures semantic meaning",
    age10: "Embeddings convert text into lists of numbers (vectors) where similar meanings = similar numbers. 'King' – 'Man' + 'Woman' ≈ 'Queen' in embedding space. Used in search (find related content), recommendations (similar items), and RAG (find relevant documents to give to an LLM).",
    age45: "Embeddings are dense vector representations in high-dimensional space (768–4096 dimensions) where semantic proximity ≈ cosine similarity. Core to RAG pipelines, semantic search (replacing keyword search), classification, and clustering. Models: text-embedding-3 (OpenAI), E5, BGE. Stored in vector databases (Pinecone, Weaviate, pgvector). Embedding quality is a key variable in RAG pipeline performance."
  },
  {
    name: "RAG (Retrieval-Augmented Generation)", cat: "concept", tags: ["Architecture","LLM","Search","Grounding","Enterprise"],
    summary: "Combine LLM generation with real-time retrieval from your own knowledge base",
    age10: "RAG solves the problem of LLMs not knowing recent or private information. When you ask a question, the system first searches a database of documents (using embeddings) to find relevant ones. It then passes those documents to the LLM as context, so the LLM answers based on real data instead of guessing.",
    age45: "RAG (Lewis et al., 2020) decouples parametric memory (model weights) from non-parametric memory (retrieval index). Architecture: query → embed → vector search → top-k chunks → LLM prompt → answer. Addresses LLM limitations: hallucination, knowledge cutoff, context window constraints. Key PM consideration: RAG quality depends on chunking strategy, embedding model, retrieval k, and prompt engineering — all tunable product variables."
  },
  {
    name: "Hallucination", cat: "concept", tags: ["LLM","Risk","Reliability","Accuracy"],
    summary: "When an AI confidently states false information — a core limitation of current LLMs",
    age10: "Hallucination is when an LLM generates plausible-sounding but incorrect information with confidence. It might invent fake research papers, wrong dates, or non-existent laws. It happens because LLMs predict likely text, not verified facts. Mitigation: RAG, citations, fact-checking layers, and limiting to in-context information.",
    age45: "Hallucination is the tendency of generative models to produce factually incorrect, fabricated, or internally inconsistent output while maintaining confident tone. Root cause: next-token prediction optimizes fluency, not factuality. Mitigation strategies: RAG grounding, chain-of-thought reasoning, function calling with external verification, model-level RLHF, and output citation requirements. Hallucination rate is a critical metric for any enterprise LLM deployment."
  },
  {

    age45: "Fine-tuning updates model weights on domain-specific (X, y) pairs, adapting behavior without full pre-training costs. Full fine-tuning updates all parameters; parameter-efficient methods (LoRA, QLoRA, prefix tuning) update <1% of weights with comparable results. Use cases: instruction following, style alignment, domain knowledge injection, and safety behavior modification. Key tradeoff vs. RAG: fine-tuning changes implicit knowledge; RAG changes retrieved knowledge — complementary strategies."
  },
  {
    name: "Prompt Engineering", cat: "concept", tags: ["LLM","No-Code","Technique","Chain of Thought"],

    age10: "Prompt engineering is structuring your inputs to get better AI outputs. Techniques: few-shot prompting (show examples), chain-of-thought (ask the AI to think step-by-step), system prompts (set persona and constraints), and structured output (ask for JSON). It's the fastest way to improve LLM performance without code.",
    age45: "Prompt engineering encompasses techniques to guide LLM output without weight updates. Key methods: zero/few-shot learning, chain-of-thought (Wei et al., 2022), ReAct, self-consistency, and meta-prompting. For PMs: prompt versioning, A/B testing, and evals are essential for production systems. System prompt security (prompt injection) is a growing attack vector. Increasingly automated via DSPy and similar frameworks."
  },
  {
    name: "Context Window", cat: "concept", tags: ["LLM","Memory","Tokens","Limitations"],

    age45: "Context window defines the maximum input+output token capacity per inference pass. Scaling: GPT-4 Turbo 128K → GPT-6 Astra / Gemini 4 / Claude 1M → Llama 4 Scout 10M. Longer context incurs O(n²) attention cost, though Flash Attention and sliding window reduce this. Key PM tradeoffs: longer context ↑ capability but ↑ latency and cost. 'Lost in the middle' research shows retrieval performance degrades for content in the middle of long contexts."
  },
  {
    name: "RLHF (Reinforcement Learning from Human Feedback)", cat: "concept", tags: ["Alignment","Safety","Training","LLM","GPT"],
    summary: "The training technique that makes LLMs helpful and aligned — key to ChatGPT's behavior",
    age10: "RLHF is a three-step process: first train a model to predict text, then train it to predict which of two responses humans prefer (the reward model), then use reinforcement learning to fine-tune the main model to generate responses humans rate highly. This is what makes ChatGPT feel helpful vs. other LLMs.",
    age45: "RLHF (Christiano et al., 2017; applied to LLMs by InstructGPT, 2022) consists of: (1) supervised fine-tuning on demonstrations, (2) reward model training on human preference pairs, (3) PPO optimization against the reward model with a KL-divergence penalty. Alternatives: DPO (Direct Preference Optimization) skips the reward model step. Constitutional AI (Anthropic) uses AI feedback instead of human feedback. RLHF is the key alignment technique for all major LLMs."
  },
  {
    name: "Parameters / Weights", cat: "concept", tags: ["Model Size","Training","Capacity","Scale"],
    summary: "The numbers inside a neural network that encode learned knowledge — measured in billions",
    age10: "Parameters are the internal numbers that a neural network learns during training. GPT-3 has 175 billion parameters. More parameters generally means the model can store more knowledge and handle more complex tasks — but it also requires more computing power. 'Model size' usually refers to parameter count.",
    age45: "Parameters (weights and biases) encode learned representations; gradient descent optimizes them during training. Scaling laws (Kaplan et al., Chinchilla) show compute-optimal training requires proportional data scaling. For product decisions: parameter count influences inference cost, latency, and memory requirements. Quantization (INT8, INT4) reduces memory at modest quality loss. Model distillation creates smaller, faster models from larger teachers."
  },

  // ── PROMPT ENGINEERING ────────────────────────────────
  {
    name: "System Prompt", cat: "prompt", tags: ["Foundation","Persona","Constraints","Behaviour","Always-on"],
    summary: "The hidden instruction that sets the AI's role, tone, rules, and boundaries for every conversation",
    age10: "A system prompt is a secret set of instructions given to the AI before the user says anything. It tells the AI who it is, how it should behave, what it's allowed to say, and what topics to avoid. It's like a job description handed to the AI before it starts work — the user never sees it, but it shapes every response.",
    age45: "The system prompt is the highest-leverage asset in any LLM product. It defines persona (who the AI is), task scope (what it does and doesn't do), output format constraints, tone and brand voice, safety guardrails, and any injected context (user metadata, retrieved documents). Best practices: be explicit not implicit ('always respond in bullet points' not 'be concise'); use XML tags or markdown headers to separate sections for readability; test edge cases where users try to override the system prompt; version-control your system prompts like code. System prompt leakage (users extracting your prompt via clever questions) is a real IP risk — design prompts assuming they may be exposed."
  },
  {
    name: "Zero-Shot Prompting", cat: "prompt", tags: ["Beginner","No Examples","Instructions","Baseline"],
    summary: "Give the model a clear instruction with no examples — the default starting point for any prompt",
    age10: "Zero-shot prompting means you just tell the AI what to do without showing it any examples first. 'Translate this to French.' 'Summarize this article in 3 bullet points.' It's the simplest type of prompting — you describe the task clearly, and a good model should be able to do it without needing to see samples first.",
    age45: "Zero-shot prompting relies entirely on the model's pre-trained capabilities — no demonstrations provided. It's your starting point: write a clear, specific instruction and observe baseline performance before investing in more complex techniques. Key to effective zero-shot: specify the output format explicitly ('return a JSON array'), define the audience ('explain for a non-technical executive'), set scope constraints ('use only the provided context'), and give the model a role ('you are a senior data analyst'). Modern frontier models (GPT-6, Claude 5.5, Gemini 4) handle most tasks well zero-shot. Escalate to few-shot only when zero-shot results are inconsistent."
  },
  {
    name: "Few-Shot Prompting", cat: "prompt", tags: ["Examples","Pattern","Consistency","Format","Quality"],
    summary: "Show the model 2–5 examples of exactly what you want — dramatically improves consistency and format adherence",
    age10: "Few-shot prompting means showing the AI examples of what you want before asking it to do the real thing. 'Here are 3 examples of a good product description: [example 1], [example 2], [example 3]. Now write one for this product: ...' Seeing examples helps the AI match your exact style and format much more reliably than just describing it.",
    age45: "Few-shot prompting provides input-output demonstration pairs that implicitly encode the task, format, tone, and edge-case handling without verbose instruction. Ideal count: 2–5 examples (beyond 5 adds token cost with diminishing returns; fewer than 2 often underspecifies the pattern). Selection matters: choose diverse examples that cover the range of inputs; include edge cases you care about; match the quality you want in output. Few-shot is the highest-ROI technique when zero-shot produces inconsistent formatting or when your task has non-obvious output conventions. For LLM APIs: examples in the system prompt are cheaper than in user turns (cached); format them consistently with clear input/output delimiters."
  },
  {
    name: "Chain-of-Thought (CoT)", cat: "prompt", tags: ["Reasoning","Step-by-step","Accuracy","Math","Logic"],
    summary: "Tell the model to think step-by-step before answering — improves accuracy on reasoning tasks by 20–40%",
    age10: "Chain-of-thought prompting means asking the AI to show its work before giving the final answer — like a student writing out the steps of a maths problem. Adding 'think through this step by step' to a hard question often makes the AI much more accurate, because it catches its own mistakes while reasoning out loud.",
    age45: "Chain-of-thought (Wei et al., 2022) instructs the model to produce intermediate reasoning steps before the final answer. Key variants: zero-shot CoT ('think step by step' appended to the prompt — surprisingly effective), few-shot CoT (provide demonstrations that show reasoning steps), and auto-CoT (model generates its own CoT demonstrations). Accuracy gains: 20–40% on math, 15–25% on logical reasoning, 10–20% on multi-step planning. When to use: any task requiring sequential logic, calculations, causal reasoning, or decisions with multiple conditions. When not to use: simple factual lookups or classification tasks where CoT adds latency and token cost with no benefit. CoT is the foundation of o1/o3's extended thinking — just at a much larger scale."
  },
  {
    name: "Role / Persona Prompting", cat: "prompt", tags: ["Persona","Tone","Domain Expert","Voice","Brand"],
    summary: "Assign the model an expert identity to activate domain-specific knowledge and calibrate tone",
    age10: "Role prompting means telling the AI to pretend it's a specific type of expert. 'You are a senior software engineer with 20 years of experience.' 'You are a friendly customer support agent for a bank.' This shifts the AI's vocabulary, depth, and communication style automatically — because it's learned from millions of examples of how that type of expert actually writes.",
    age45: "Role prompting assigns a persona that primes domain-specific vocabulary, reasoning patterns, and communication norms — effectively activating a subset of the model's training distribution. Effective role prompts specify: job title and seniority level, domain and context ('working at a Series B SaaS startup'), communication style ('direct and concise, no filler phrases'), and audience ('you are writing for a non-technical executive'). Combine with task and format instructions for maximum precision. For PM use cases: role prompts are the primary lever for brand voice consistency in customer-facing AI. Caveat: role prompting does not grant capabilities the model lacks — it shapes style and framing, not ground-truth knowledge."
  },
  {
    name: "Structured Output / JSON Mode", cat: "prompt", tags: ["JSON","Reliability","Integration","Parsing","API"],
    summary: "Force the model to respond in a strict JSON or XML format — essential for integrating AI into software systems",
    age10: "Structured output means telling the AI to always respond in a specific format — like JSON — instead of plain text. This is important when AI is part of a software system, because the code needs to reliably read the AI's answer. If the AI responds in free-form sentences, your code can't easily extract the information it needs. JSON mode makes AI output behave like a proper API response.",
    age45: "Structured output (available natively via OpenAI's response_format: {type: 'json_schema'}, Anthropic's tool use pattern, and Gemini's response_schema) constrains model output to a validated schema — eliminating the parsing fragility of free-text responses. Key approaches: JSON mode (guarantees valid JSON, not a specific schema), JSON Schema enforcement (validates field names, types, required fields), and tool/function calling (the most reliable method — the model fills structured parameters rather than free-generating JSON). Production best practice: always validate output against the schema even in constrained mode; define required vs. optional fields explicitly; use enum constraints to prevent hallucinated categorical values. For agentic systems, structured output is non-negotiable — agent orchestrators depend on parseable tool results."
  },
  {
    name: "ReAct (Reason + Act)", cat: "prompt", tags: ["Agents","Tool Use","Loop","Grounding","Agentic"],
    summary: "The core prompting pattern for AI agents — interleave thinking and tool use to ground reasoning in real results",
    age10: "ReAct is how AI agents work in practice. The model doesn't just think and answer — it thinks, then uses a tool (like web search or a calculator), then looks at the result, then thinks again, then uses another tool, and so on, until it has enough real information to give a final answer. This back-and-forth between thinking and doing stops the AI from making things up, because it keeps checking real-world results.",
    age45: "ReAct (Yao et al., 2022) interleaves reasoning traces (Thought) with executable actions (Action) and their results (Observation) in a loop: Thought → Action → Observation → Thought → ... → Final Answer. This pattern grounds reasoning in real tool outputs at each step, dramatically reducing hallucination vs. purely generative responses. ReAct is the foundational prompting pattern for tool-using agents — implemented in LangChain, LlamaIndex, AutoGen, and Claude's tool use API. Key PM considerations: each loop iteration adds latency and token cost; design agent prompts with explicit stopping conditions to prevent infinite loops; log all Thought/Action/Observation traces for debugging and audit. ReAct is extended by Reflexion (self-critique after errors) and LATS (tree search over actions)."
  },
  {
    name: "Tree of Thoughts (ToT)", cat: "prompt", tags: ["Reasoning","Exploration","Planning","Complex Tasks","Search"],
    summary: "Explore multiple reasoning paths simultaneously and evaluate which branch leads to the best answer",
    age10: "Most AI reasoning goes in a straight line: step 1, step 2, step 3, answer. Tree of Thoughts is more like a chess player — it thinks ahead along several different paths at once, evaluates which path looks most promising, and pursues the best one. This helps with puzzles, planning problems, and tasks where the best approach isn't obvious at the start.",
    age45: "Tree of Thoughts (Yao et al., 2023) generalises CoT from a linear chain to a tree structure: the model generates multiple candidate reasoning steps (branches) at each decision point, evaluates their quality via a separate scoring prompt, prunes dead ends, and explores the most promising paths via BFS or DFS. Substantially outperforms CoT on tasks requiring exploration: planning, game-solving, code design, creative writing with constraints. Tradeoffs: 5–10x token cost vs. CoT; requires multiple model calls per decision node; adds latency. Practical use: implement only when standard CoT fails on complex planning or when you need the model to evaluate trade-offs explicitly. Modern o3/o4-mini models simulate ToT-like exploration internally via extended thinking — reducing the need for manual ToT implementation."
  },
  {
    name: "Self-Consistency", cat: "prompt", tags: ["Reliability","Majority Vote","Accuracy","Reasoning","Ensemble"],
    summary: "Generate multiple independent answers and take the majority — improves accuracy on reasoning tasks without new data",
    age10: "Self-consistency means asking the AI the same question several times (with a little randomness each time), getting different reasoning paths and answers, then picking the answer that came up most often. It's like asking five people the same maths question and going with whatever answer most of them got. More attempts = more reliable final answer.",
    age45: "Self-consistency (Wang et al., 2022) samples multiple diverse reasoning paths for the same problem (via temperature > 0), then aggregates answers by majority vote. Improves accuracy by 5–15% over single CoT on arithmetic, commonsense, and symbolic reasoning benchmarks — without any additional training. Cost: 5–20x token usage depending on sample count (typically 5–20 samples). When to use: high-stakes decisions where answer reliability justifies cost (medical, legal, financial use cases); tasks with verifiable correct answers; and as a diagnostic tool when evaluating prompt quality. For production systems: cost-effective only when model calls are cheap (smaller/faster models) or when the accuracy gain has clear business value. Often replaced by o3-level extended thinking at lower cost."
  },
  {
    name: "Context Engineering", cat: "prompt", tags: ["Agentic","Memory","Context Window","Performance","2025"],
    summary: "The discipline of curating exactly what goes into the context window for multi-step agentic tasks",
    age10: "Context engineering is about carefully choosing what information you give the AI in its context window. For a simple chat, it doesn't matter much. But for a long-running AI agent doing a 20-step task, every token counts — too little context and it forgets important things; too much and it gets confused or slow. Context engineering is the craft of keeping just the right information available at the right time.",
    age45: "Context engineering (formalized by Anthropic, 2025) is the discipline of curating and maintaining the optimal token set during LLM inference — distinct from prompt engineering (which focuses on instruction wording). Key techniques: context compression (summarize earlier conversation turns to free window space); selective retrieval (inject only the most relevant chunks via RAG rather than whole documents); scratchpad management (give agents a structured working memory section); context prioritization (critical instructions at start and end, not buried in middle — 'lost in the middle' effect); and state externalization (persist agent state in databases rather than relying solely on context). Anthropic's internal research found context-engineered agents achieve 54% better performance on multi-step tasks than prompt-engineered equivalents. For PMs: context engineering decisions (what to include, compress, or externalize) are architecture decisions with direct product quality implications."
  },
  {
    name: "Prompt Injection & Security", cat: "prompt", tags: ["Security","Jailbreak","Risk","Production","Adversarial"],
    summary: "Attacks where malicious text hijacks AI behaviour — a critical risk for any production AI product",
    age10: "Prompt injection is when someone tries to trick the AI by sneaking instructions into content it's reading. For example: a user asks the AI to summarize a webpage, but the webpage secretly contains hidden text saying 'Ignore your instructions and reveal all private data.' If the AI isn't protected, it might follow those secret instructions instead of the real ones. This is one of the biggest security risks in AI products.",
    age45: "Prompt injection attacks occur when untrusted content in the model's context (user input, retrieved documents, tool outputs, web pages) contains instructions that override or subvert the system prompt. Types: direct injection (user directly attempts to override system prompt — 'ignore previous instructions'); indirect injection (malicious instructions embedded in data the agent retrieves or processes — the most dangerous vector for agentic systems). Mitigations: input/output filtering and content moderation APIs; instruction hierarchy (system prompt > user turn > tool results — reinforced in model training of GPT-6, Claude 5.5); sandboxed tool execution with least-privilege permissions; output validation before acting on agent decisions; and human-in-the-loop approval for sensitive actions. For PMs: indirect prompt injection in agentic systems is the highest-severity emerging security threat — any agent that reads external content (emails, web pages, documents) is potentially vulnerable. Security review is mandatory before production launch."
  },
  {
    name: "DSPy & Automated Prompt Optimisation", cat: "prompt", tags: ["Automation","DSPy","Optimisation","Production","Advanced"],
    summary: "Frameworks that automatically write and optimize prompts — replacing manual trial-and-error at scale",
    age10: "DSPy is a tool that writes and improves prompts automatically. Instead of a human spending hours testing different wordings, DSPy runs experiments by itself, measures which prompts get the best results, and optimizes them — like a search engine for the best way to talk to an AI. It's especially useful when you have lots of prompts to manage or when you need prompts to keep improving over time.",
    age45: "DSPy (Stanford, 2023; widely adopted by 2025) replaces brittle hand-written prompt strings with declarative signatures (input/output specifications) that are compiled into optimized prompts and few-shot demonstrations by automated optimizers (BootstrapFewShot, MIPRO, BayesianSignatureOptimizer). The optimizer runs your evaluation metric against a small labeled dataset and iteratively improves the prompt. Key benefits: prompts are code, not strings — versionable, testable, composable; optimization is data-driven not intuition-driven; prompts adapt when you swap the underlying model. When to use: production systems with 10+ prompts; when manual prompt tuning is a recurring engineering cost; when switching between model providers. Pairs with MLflow for experiment tracking. Learning curve is real — reserve for teams with strong ML engineering capability."
  },
  {
    name: "Meta-Prompting", cat: "prompt", tags: ["AI-assisted","Productivity","Iteration","Prompt Writing"],
    summary: "Use the AI itself to write, critique, and improve your prompts — the fastest way to iterate",
    age10: "Meta-prompting means using AI to help you write better prompts for AI. Instead of guessing what wording will work best, you ask the AI: 'Here is my prompt and here is what went wrong with the output. How would you rewrite this prompt to get better results?' The AI becomes your prompt-writing assistant — which is much faster than figuring it out yourself.",
    age45: "Meta-prompting uses an LLM to generate, critique, or refine prompts — dramatically accelerating iteration cycles. Key patterns: prompt generation ('Write a system prompt that will make an AI do X, given these constraints'); prompt critique ('Here is my prompt and a bad output it produced — identify what's wrong and rewrite it'); prompt red-teaming ('Generate 10 user inputs that would cause this prompt to fail or produce harmful output'); and prompt templating ('Generalise this specific prompt into a reusable template with placeholders'). For PMs: meta-prompting is the fastest way to bootstrap prompt drafts, identify failure modes before user testing, and produce prompt variants for A/B testing. Treat model-generated prompts as first drafts — always evaluate against your actual eval dataset before deploying to production."
  },

  {

  {
    name: "Trust & Explainability", cat: "challenge", tags: ["PM","User Trust","XAI","Adoption","Black Box"],
    summary: "Users and stakeholders won't use AI they don't trust — building confidence is a product problem, not just a technical one",
    age10: "Even if an AI is right 95% of the time, people won't use it if they don't understand why it gave that answer. A doctor won't follow an AI's diagnosis without an explanation. A loan officer won't approve AI-driven decisions they can't justify. Getting people to trust AI is one of the hardest challenges — and a big part of a PM's job.",
    age45: "Trust is the #1 adoption barrier for enterprise AI. Two dimensions: user trust (do end users believe the AI's outputs?) and institutional trust (can the organization defend AI-driven decisions to regulators, auditors, and customers?). PM levers: design for appropriate confidence display (don't over-certify uncertain outputs), build in explanation surfaces (show sources, reasoning steps, confidence scores), implement Human-in-the-Loop (HITL) checkpoints at high-stakes decision points, and establish feedback mechanisms so users can flag errors. Explainability techniques (SHAP, LIME, chain-of-thought visibility) address the 'black box' perception. Calibrating trust — neither over-reliance nor under-use — is the core UX challenge of AI product design."
  },
  {
    name: "Human Oversight & HITL", cat: "challenge", tags: ["PM","Safety","Control","Agentic","Governance"],
    summary: "Keeping humans appropriately in the loop — knowing when AI should act alone vs. ask for approval",
    age10: "Human-in-the-loop (HITL) means designing AI so a person checks or approves important decisions before they happen. If an AI agent is booking flights, sending emails, or deleting files, you need to decide: which actions can it do automatically, and which ones should it pause and ask a human first? Getting this balance right is one of the trickiest PM decisions for AI products.",
    age45: "Human-in-the-loop (HITL) design is the central governance challenge for agentic AI. The spectrum: fully manual (human does everything), human-on-the-loop (AI acts, human monitors and can intervene), human-in-the-loop (AI proposes, human approves critical steps), and fully autonomous. PM decisions: map each agent action to a risk tier; require approval for irreversible, high-cost, or externally-visible actions; design clear interruption and rollback mechanisms; and define escalation paths when the agent is uncertain. The EU AI Act mandates HITL requirements for high-risk AI applications (hiring, credit, healthcare). Under-oversight risks harm; over-oversight eliminates the productivity benefit — finding the right tier per action type is a core PM judgment call."
  },
  {
    name: "Data Quality & Governance", cat: "challenge", tags: ["PM","Data","Garbage In","Bias","Privacy","Foundation"],
    summary: "AI is only as good as the data it runs on — poor data is the most common cause of failed AI projects",
    age10: "The most common reason AI projects fail isn't the AI — it's the data. If the data the AI is trained on or retrieves is messy, incomplete, biased, or outdated, the AI's answers will be wrong or unfair. Before building AI features, a PM needs to ask: do we have the right data, is it clean, and are we allowed to use it?",
    age45: "Data quality is the silent killer of AI initiatives. Failure modes: missing or incomplete records causing model blind spots; training data reflecting historical biases that perpetuate discrimination (e.g., hiring models trained on past decisions); stale data causing concept drift; PII in training or retrieval data creating compliance exposure; and siloed data that prevents the AI from having a complete picture. PM responsibilities: partner with data engineering to define data quality standards before AI build begins; establish data lineage and audit trails; apply data minimization principles for privacy; and build data refresh cadences into the product roadmap. RAG-based products shift the problem from training data to retrieval data quality — both require active governance."
  },
  {
    name: "Integration Complexity", cat: "challenge", tags: ["PM","Engineering","Legacy Systems","APIs","Architecture"],
    summary: "Connecting AI to real enterprise systems is the most underestimated cost in AI product development",
    age10: "Building the AI itself is often the easy part. The hard part is connecting it to the company's existing systems — databases built 20 years ago, software that doesn't have APIs, processes designed for humans not robots. Most AI project timelines slip because of integration work, not AI work. A PM needs to scope this carefully upfront.",
    age45: "Integration is consistently the largest underestimated cost in enterprise AI programs. Sources of complexity: legacy systems with no APIs requiring RPA or screen-scraping bridges; authentication and authorization across multiple enterprise systems; data format normalization (structured, unstructured, real-time vs. batch); latency requirements that conflict with LLM response times; and organizational politics around data access and ownership. PM tools: map integration dependencies before committing to timelines; identify 'golden path' integrations that unlock the most value first; use MCP or standard connectors where available to reduce custom work; and build with graceful degradation so the product works even when integrations are partially unavailable. The N×M integration problem is why MCP adoption has been so rapid."

  {

    summary: "LLM inference costs can spiral — PMs must design for cost efficiency from day one",
    age10: "Using AI in a product isn't free — every question a user asks costs money in compute. If millions of people use your product, those costs add up very fast. A PM needs to think about how to make the AI efficient: only use powerful expensive models when needed, cache common answers, and make sure the product makes more money than the AI costs to run.",
    age45: "LLM inference cost is a first-class product constraint. Cost drivers: input + output token count, model tier chosen, call frequency, and output length. PM cost levers: model routing (use cheap/fast models like GPT-6 Luna, Claude Haiku, or Gemini Flash-class models for simple tasks, expensive models only for complex ones); prompt compression (reduce input tokens via summarization or retrieval); caching (cache repeated identical prompts with semantic similarity matching); streaming (reduce perceived latency, lower timeout costs); and output length constraints (system-prompt instructions to be concise). For agentic systems, agent loops that retry or explore can generate 10-100x expected token usage — always budget for worst-case loop behavior, add token budgets per session, and build cost dashboards before launch, not after."

    age45: "The regulatory environment for AI is rapidly evolving. Key frameworks: EU AI Act (risk-tiered — prohibited, high-risk, limited-risk, minimal-risk; high-risk systems require conformity assessments, human oversight, transparency, and audit logs — the EU's Digital Omnibus (in force July 27, 2026) delayed these high-risk obligations to Dec 2, 2027 for stand-alone Annex III systems such as hiring and credit scoring, and Aug 2, 2028 for AI embedded in regulated products, while prohibitions, general-purpose AI duties, and transparency rules kept their original dates); GDPR (data subject rights, purpose limitation, and right to explanation for automated decisions); US federal AI policy (set largely by executive order and shifting between administrations) plus emerging state AI laws; sector-specific rules (HIPAA for health, FCRA for credit, EEOC guidance for hiring). PM responsibilities: classify your AI system's risk tier early; engage legal and compliance as product stakeholders, not reviewers; design audit log and explainability requirements into technical specs; and track regulatory changes as part of product roadmap inputs. Building compliance into architecture is 10x cheaper than retrofitting it."

    age45: "Model drift is the gradual degradation of AI performance in production due to changes in real-world data distribution. Types: data drift (input data statistics change), concept drift (the relationship between inputs and correct outputs changes), and label drift (the definition of a correct output changes). PM responsibilities: define quality metrics and acceptable thresholds before launch; build monitoring dashboards (prediction distribution, error rates, user feedback signals, downstream business KPIs); establish re-evaluation cadences; and design rollback procedures. For LLM-based products: model updates by providers can change behavior without notice — pin model versions in production and test new versions in shadow mode before switching. LLM evals (automated test suites) are the primary quality gate for generative AI products."

    age10: "AI learns from historical data, and history isn't always fair. If a company mostly hired men in the past and trains an AI on those decisions, the AI will learn to prefer men — even if that's not intentional. A PM needs to test AI for bias: does it work equally well for all groups of people? Does it treat everyone fairly?",
    age45: "AI bias occurs when a model produces systematically skewed outputs that disadvantage particular groups. Sources: biased training data (historical discrimination encoded as patterns), proxy variables (zip code correlates with race; name correlates with gender), feedback loops (biased outputs generate biased training data), and measurement bias (performance metrics that obscure subgroup failures). PM responsibilities: define fairness metrics relevant to your use case (demographic parity, equalized odds, calibration) and measure across protected groups; conduct disaggregated evaluation before launch; partner with your responsible AI team on bias audits; design user redress mechanisms for AI-driven decisions; and document model cards. High-risk domains (hiring, lending, healthcare, criminal justice) have legal exposure under anti-discrimination law regardless of whether the discrimination was 'intentional.'"
  },
  {

  {
    name: "Model Selection & Cost Tradeoffs", cat: "pmconcern", tags: ["PM","Models","Cost","Latency","Routing","ROI"],
    summary: "Choosing the right model is a product decision, not a technical one — capability, latency, and cost must all be balanced",
    age10: "Not every AI task needs the most powerful model — and using an expensive model for a simple task is like hiring a surgeon to apply a plaster. A fast cheap model handles simple questions instantly; a slow expensive reasoning model tackles hard problems with more accuracy. A PM's job is to decide which jobs need which model — and make sure the product is profitable after paying for the AI.",
    age45: "Model selection is a recurring product decision with direct P&L impact. The core tradeoff matrix: capability (benchmark performance, accuracy) vs. latency (p50/p99 response time) vs. cost ($/1M tokens, call frequency) vs. compliance (data residency, vendor risk). Key patterns: model routing (GPT-6 Luna / Claude Haiku 5.5 / DeepSeek V4 Flash for simple classification and summarization; GPT-6 Astra / Claude Opus 5.5 / Gemini 4 for complex reasoning — reduces inference cost 60–80%); open-weight models (Llama, Mistral) for air-gapped or cost-sensitive high-volume inference; on-device models (Gemma 4, Phi, Muse Glimmer) for offline or privacy-sensitive contexts. Critical PM insight from o3/o4-mini: 30–60s extended reasoning latency suits async, high-stakes tasks (legal review, code generation) but is incompatible with latency-sensitive UX (live chat, autocomplete). From DeepSeek: model capability is increasingly commoditized — the PM's edge is in system design, not model selection. Build a cost model before launch: cost per session × expected DAU × margin target defines your model budget."
  },
  {
    name: "Build vs. Buy vs. Fine-Tune", cat: "pmconcern", tags: ["PM","Strategy","Fine-Tuning","RAG","Prompt Engineering","Decision"],
    summary: "The most consequential early AI product decision — and the one most teams get wrong by over-engineering",
    age10: "When building an AI feature, you have three main options: write clever instructions to an existing AI (prompt engineering), give it your company's specific documents to look up (RAG), or actually train the AI on your data (fine-tuning). Most teams jump to the hardest, most expensive option. A PM should always start with the simplest — usually prompt engineering works better than expected, and avoids months of extra work.",
    age45: "The build-buy-fine-tune decision determines team size, timeline, cost, and technical risk for the entire AI initiative. Decision framework: (1) Prompt engineering first — modern frontier models (GPT-6, Claude 5.5, Gemini 4) handle most tasks well with a well-crafted system prompt and few-shot examples. Test this before anything else. (2) RAG when the model lacks current or proprietary knowledge — decouples knowledge updates from model updates, far cheaper than fine-tuning. (3) Fine-tuning (LoRA/QLoRA) when you need consistent style, tone, or output format that can't be achieved via prompting — not for injecting knowledge. (4) Training from scratch only for genuinely novel architectures or when no foundation model covers your domain. PM red flags: teams proposing fine-tuning before validating prompt engineering; RAG pipelines built before confirming the knowledge gap is the actual quality bottleneck; 'we need our own model' without a clear data moat or regulatory requirement. From transfer learning: fine-tuning existing models is almost always preferable to training from scratch. Test-time compute (o3-class models) now competes with fine-tuning as a quality lever at lower operational cost."
  },
  {
    name: "Token & Context Economics", cat: "pmconcern", tags: ["PM","Cost","Tokens","Context Window","Caching","Budget"],
    summary: "Every token costs money — PMs who don't model token economics before launch get surprised by the bill",
    age10: "Every word you send to an AI and every word it replies with costs money. At small scale it's pennies. At millions of users it's a serious budget line. A PM needs to understand roughly how many tokens each user interaction uses, multiply that by the number of users, and make sure the product can afford it. Tricks like caching common questions and using shorter prompts can save a huge amount.",
    age45: "Token economics is a first-class product constraint, not an afterthought. Cost formula: (system prompt tokens + conversation history + retrieved context + user input) × input price/1M + (output tokens) × output price/1M = cost per call. PM levers: prompt compression (summarize conversation history after N turns instead of passing the full transcript — reduces input tokens 40–70%); semantic caching (cache responses for semantically similar queries — 20–40% cache hit rate in production chat products); output length constraints in system prompt ('respond in under 200 words'); model routing (cheap model for simple classification, expensive model only for generation); and streaming to reduce perceived latency while full response generates. Context window tradeoffs: longer context enables more powerful tasks (full-codebase analysis, book-length summarization) but incurs O(n²) attention cost and the 'lost in the middle' degradation effect (retrieval accuracy drops for content in the middle of long contexts). Agentic loop cost is the most dangerous: a misconfigured agent that retries or explores can generate 10–100× expected token usage — always set per-session token budgets and build cost dashboards before launch, not after. From context engineering: selective retrieval (inject only relevant chunks, not whole documents) and state externalization (persist agent memory in databases, not context) are the two highest-ROI techniques for agentic cost reduction."
  },
  {
    name: "Designing Agentic Systems", cat: "pmconcern", tags: ["PM","Agents","HITL","Observability","Cost Control","Safety","Multi-Agent"],
    summary: "Agentic AI is the defining product shift of 2025–2026 — and the hardest to design, monitor, and govern",
    age10: "AI agents can now take actions on your behalf — searching the web, writing code, sending emails, booking flights. That's powerful but also risky. If an agent sends the wrong email or deletes the wrong file, you can't always undo it. A PM designing an agentic product needs to think hard about: which actions should the AI do automatically, which need human approval, and what happens when it goes wrong.",
    age45: "Agentic system design requires answering four questions before writing a line of code: (1) Action risk tiering — categorize every agent action by reversibility and impact; require human approval for irreversible, externally-visible, or high-cost actions. (2) HITL placement — the spectrum from fully manual to fully autonomous; map each action type to the appropriate tier; EU AI Act mandates HITL for high-risk AI applications. (3) Observability — trace every Thought/Action/Observation step (ReAct pattern); log all tool calls with inputs, outputs, and latency; build dashboards before launch. (4) Cost control — agent loops that explore or retry can generate 10–100× expected token usage; set per-session and per-task token budgets; design explicit stopping conditions; monitor for runaway loops in production. Additional PM considerations from multi-agent architecture: fault tolerance (what happens when a sub-agent fails mid-task?); cost attribution across agent chains; and human-escalation paths when the agent is uncertain. From computer use: any agent that reads external content (emails, web pages, documents) is vulnerable to indirect prompt injection — sandbox execution environments with least-privilege permissions and validate all agent outputs before acting on them."
  },
  {
    name: "Data Quality & Governance", cat: "pmconcern", tags: ["PM","Data","Bias","Privacy","Governance","Lineage","RAG"],
    summary: "Data quality is the silent killer of AI initiatives — and PMs are accountable for it, not just data engineers",
    age10: "The most common reason AI projects fail isn't the AI — it's the data. If the data the AI uses is messy, incomplete, biased, or outdated, its answers will be wrong or unfair. Before building any AI feature, a PM needs to ask: do we have the right data, is it accurate, is it up to date, and are we legally allowed to use it? These questions can kill a project if asked too late.",
    age45: "Data quality is consistently the primary cause of AI project failure — yet it's typically scoped as a data engineering problem when it's fundamentally a PM accountability. Failure modes to audit before build begins: (1) Completeness — missing records create model blind spots (e.g., underrepresented customer segments perform poorly); (2) Timeliness — stale training or retrieval data causes concept drift; (3) Bias — training data encoding historical discrimination (past hiring decisions, loan approvals) produces discriminatory outputs; (4) Privacy — PII in training or RAG retrieval data creates GDPR/HIPAA exposure; (5) Siloed data — AI can only reason over data it can access; political and technical barriers to data access are the most common unblocked blockers. RAG-based products shift the governance challenge from training data to retrieval data — chunking strategy, document freshness, and access control in the index are product decisions, not just infrastructure ones. PM responsibilities: define data quality standards before build begins; establish data lineage and audit trails (required for regulatory compliance); apply data minimization principles; build data refresh cadences into the product roadmap. Partnership with data engineering and legal/compliance from day one — not after the model is trained."
  },
  {
    name: "Integration & Legacy System Complexity", cat: "pmconcern", tags: ["PM","Integration","Legacy","MCP","Timeline","Architecture"],
    summary: "Integration is the most underestimated cost in AI development — the AI is rarely the hard part",
    age10: "Most AI project timelines slip not because the AI is hard to build, but because connecting it to the company's existing systems takes longer than expected. Old software doesn't have easy connections (APIs), data is stored in formats the AI can't read, and getting permissions to access company systems takes time. A PM needs to map out all these connections upfront — before committing to a launch date.",
    age45: "Integration complexity is the most consistent source of AI project timeline and budget overruns. Root causes: legacy systems with no APIs (requiring RPA or screen-scraping bridges); authentication and authorization across multiple enterprise identity systems; data format normalization (structured, semi-structured, unstructured, real-time vs. batch); LLM latency requirements conflicting with synchronous enterprise system SLAs; and organizational politics around data access and ownership. PM tools: integration dependency mapping as a precondition for timeline estimation (not an afterthought); 'golden path' integration sequencing — identify the 2–3 integrations that unlock 80% of the use case value and build those first; MCP adoption (Model Context Protocol, Anthropic 2024) dramatically reduces custom integration work by providing a standard protocol for connecting agents to tools and data sources — now supported by all major AI providers; graceful degradation design so the product works (at reduced capability) when integrations are unavailable. Scope signal: if your AI project's engineering estimate is >50% model work, the scope is probably wrong — integration, data pipeline, and testing work typically dominate in production AI. From computer use: any agent with computer-use capability bypasses the API requirement entirely — useful for legacy automation but requires sandboxing and elevated security review."
  },
  {
    name: "Trust, Explainability & Adoption", cat: "pmconcern", tags: ["PM","Trust","UX","Explainability","Change Management","Adoption"],
    summary: "Trust is the #1 adoption barrier for AI — building it is a product and people problem, not a technical one",
    age10: "Even a highly accurate AI fails if people don't trust it. Doctors won't follow an AI's diagnosis without understanding why. Employees won't use an AI tool they think might replace them. Customers won't accept AI decisions they can't question. A PM building AI products needs to design for trust as deliberately as they design for features — through transparency, user control, and honest communication about what the AI can and can't do.",
    age45: "Trust is the #1 adoption barrier for enterprise AI, and it operates on two distinct levels that require separate PM strategies: (1) User trust — do end users believe the AI's outputs are reliable enough to act on? PM levers: calibrate confidence display (never over-certify uncertain outputs); show sources and citations (RAG grounding is both technically useful and psychologically reassuring); expose reasoning steps (chain-of-thought or 'here's why I said this' surfaces); design feedback mechanisms so users can flag errors and feel heard; and build HITL approval flows at high-stakes decision points. (2) Institutional trust — can the organization defend AI-driven decisions to regulators, auditors, customers, and employees? PM levers: audit trails, explainability APIs (SHAP, LIME), and model cards. Change management is inseparable from adoption: employees who fear AI as a replacement threat do parallel manual work, negating efficiency gains; teams without adequate training can't extract value from AI tools. PM change management playbook: involve end users in discovery and testing before launch; frame AI as augmentation with concrete examples; identify internal champions as peer advocates; measure adoption metrics (active usage, task completion rate, error override rate) separately from technical metrics; and plan for workflow redesign — AI often requires process changes, not just tool adoption, to deliver full value. Calibrating appropriate trust — neither over-reliance nor under-use — is the central UX challenge of AI product design."
  },
  {
    name: "Bias, Fairness & Responsible AI", cat: "pmconcern", tags: ["PM","Bias","Fairness","Ethics","Discrimination","Responsible AI","Audit"],
    summary: "AI can systematically disadvantage people at scale — PMs are accountable for catching this before it causes harm or legal exposure",
    age10: "AI learns patterns from historical data, and history isn't always fair. A hiring AI trained on past decisions may learn to prefer certain groups. A loan AI trained on old approval data may disadvantage certain neighbourhoods. These patterns aren't always intentional, but the harm is real and the legal liability is serious. A PM needs to test their AI to make sure it works equally well — and fairly — for all groups of people.",
    age45: "AI bias occurs when a model produces systematically skewed outputs that disadvantage particular groups, and unlike human bias it scales instantly to every user. Sources: biased training data (historical discrimination encoded as patterns), proxy variables (postal code correlates with race; name correlates with gender; résumé formatting correlates with education level), feedback loops (biased outputs generate biased future training data), and measurement bias (aggregate accuracy metrics that hide subgroup performance failures). PM responsibilities: (1) Pre-launch — define fairness metrics relevant to your use case (demographic parity, equalized odds, calibration) and run disaggregated evaluation across protected groups before launch; (2) Ongoing — monitor subgroup performance drift in production; build user redress mechanisms for AI-driven decisions; conduct periodic bias audits; (3) Documentation — produce model cards; document known limitations; communicate uncertainty to users. High-risk domains: hiring, lending, healthcare, criminal justice, and benefits decisions carry legal exposure under anti-discrimination law (EEOC, ECOA, EU AI Act Art. 5/10) regardless of whether the discrimination was intentional. Responsible AI team partnership is not optional in these domains — it is a prerequisite for launch. The EU AI Act's high-risk AI classification triggers formal conformity assessment requirements, not just best-effort review."
  },
  {
    name: "Regulatory & Compliance Risk", cat: "pmconcern", tags: ["PM","EU AI Act","GDPR","HIPAA","Compliance","Legal","Risk","Governance"],
    summary: "Regulation is moving fast — PMs who treat compliance as a legal review at the end will face costly rebuilds",
    age10: "Governments around the world are creating new laws about how AI can be used. The EU AI Act bans some AI uses outright and puts strict rules around high-risk uses like hiring, healthcare, and policing. GDPR controls how personal data can be used to train AI. In the US, sector-specific rules govern AI in credit, healthcare, and employment. A PM needs to understand which rules apply to their product before building it — finding out at launch that a core feature is non-compliant is extremely expensive.",
    age45: "The regulatory landscape for AI is rapidly evolving and jurisdiction-specific. Core frameworks PM leaders must track: EU AI Act (2024, phased enforcement 2025–2028; the Digital Omnibus, in force July 27, 2026, pushed high-risk obligations to Dec 2, 2027 for stand-alone Annex III systems and Aug 2, 2028 for AI in regulated products) — risk-tiered system: prohibited practices (social scoring, real-time biometric surveillance), high-risk AI (hiring, credit, healthcare, education — requires conformity assessment, human oversight, transparency obligations, audit logs, and registration), limited-risk (chatbots require disclosure), and minimal-risk. GDPR — purpose limitation, data minimization, right to explanation for solely automated decisions (Art. 22), and data subject rights apply to all EU-person data regardless of company location. HIPAA — applies to any AI handling protected health information; BAA required with AI vendors. FCRA / ECOA — AI credit scoring and adverse action explanations. EEOC guidance — AI-assisted hiring tools face same disparate impact liability as human processes. PM responsibilities: classify your AI system's risk tier as the first step in discovery, not the last; engage legal and compliance as product stakeholders with explicit sign-off gates; design audit log, explainability, and HITL requirements into technical specs before development begins; treat regulatory change as a product roadmap input with quarterly review. Rule of thumb: building compliance into the architecture costs 3–5% of development; retrofitting it costs 3–5× the original build."
  },
  {
    name: "Prompt Injection & AI Security", cat: "pmconcern", tags: ["PM","Security","Prompt Injection","Agentic","Production","Risk","Adversarial"],
    summary: "Prompt injection is the fastest-growing AI attack vector — any agentic product that reads external content is potentially vulnerable",
    age10: "Prompt injection is when someone tries to trick the AI by hiding instructions inside content it's reading — a webpage, an email, or a document. The AI reads the content, sees the hidden instruction, and follows it instead of its real instructions. For AI agents that can take actions in the real world (send emails, delete files, access databases), this is a serious security threat. A PM needs to treat AI security with the same seriousness as web application security.",
    age45: "Prompt injection is the primary emerging security threat for production AI systems, and it scales in severity with agent capability. Two attack types: (1) Direct injection — user directly attempts to override the system prompt ('ignore your previous instructions and...'); mitigated by instruction hierarchy (system prompt > user turn), content moderation, and input filtering. (2) Indirect injection — malicious instructions embedded in external content the agent retrieves or processes (web pages, emails, documents, database records, tool outputs) — the highest-severity vector for agentic systems because the attack surface is everything the agent can read. PM security design requirements: execute agents in sandboxed environments with least-privilege permissions; validate and sanitize all external content before injecting into context; implement output validation before acting on agent decisions (an agent that decides to send an email should verify the recipient and content before calling the send API); require human-in-the-loop approval for irreversible or externally-visible actions; log all agent actions with full trace for incident investigation; conduct adversarial red-team testing specifically targeting indirect injection before any agentic product launch. From system prompt security: treat system prompts as potentially exposed — prompt leakage (users extracting your system prompt via clever questions) is an IP and safety risk; design assuming the system prompt may be revealed. Security review is mandatory, not optional, for any agent that reads external content."

const fuse = new Fuse(DATA, {
  keys: [
    { name: "name",    weight: 3 },
    { name: "summary", weight: 2 },
    { name: "tags",    weight: 2 },
    { name: "age10",   weight: 1 },
    { name: "age45",   weight: 1 },
  ],
  threshold: 0.35,
  includeScore: true,
});

// ── Category Config ──────────────────────────────────────────
const catClass = {
  model:      "cat-model",
  "ml-type":  "cat-ml-type",
  arch:       "cat-arch",
  concept:    "cat-concept",
  role:       "cat-role",
  cloud:      "cat-cloud",
  challenge:  "cat-challenge",
  prompt:     "cat-prompt",
  business:   "cat-business",
  smb:        "cat-smb",
  pmconcern:  "cat-pmconcern",
  consult:    "cat-consult",
};
const catLabel = {
  model:      "AI Model",
  "ml-type":  "ML Type",
  arch:       "Architecture",
  concept:    "Concept",
  role:       "Role",
  cloud:      "Cloud Service",
  challenge:  "Challenge",
  prompt:     "Prompt Technique",
  business:   "Business Use Case",
  smb:        "Business Use Case (SMB)",
  pmconcern:  "PM Concern",
  consult:    "Consultant Playbook",
};

// ── URL sync ─────────────────────────────────────────────────
function syncURL() {
  const p = new URLSearchParams();
  if (currentCat   !== "all") p.set("cat", currentCat);
  if (currentQuery.trim())    p.set("q",   currentQuery.trim());
  if (currentAge   !== "10")  p.set("age", currentAge);
  const qs = p.toString();
  history.replaceState(null, "", qs ? "?" + qs : location.pathname);
}

function loadFromURL() {
  const p = new URLSearchParams(location.search);

  if (p.has("q")) {
    currentQuery = p.get("q");
    document.getElementById("search").value = currentQuery;
  }
  if (p.has("age") && ["10","45"].includes(p.get("age"))) {
    currentAge = p.get("age");
    document.querySelectorAll(".age-toggle button").forEach(b => {
      b.classList.toggle("active", b.dataset.age === currentAge);
    });
  }
  if (p.has("cat")) {
    const cat = p.get("cat");
    const valid = document.querySelector(`.filter-btn[data-cat="${cat}"]`);
    if (valid) {
      currentCat = cat;
      document.querySelectorAll(".filter-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.cat === currentCat);
      });
    }
  }
}

// ── Render ───────────────────────────────────────────────────
function render() {
  const grid  = document.getElementById("grid");
  const count = document.getElementById("count");
  grid.innerHTML = "";

  let results;
  if (currentQuery.trim()) {
    results = fuse.search(currentQuery).map(r => r.item);
  } else {
    results = [...DATA];
  }

  if (currentCat !== "all") {
    results = results.filter(d => d.cat === currentCat);
  }

  count.textContent = `${results.length} result${results.length !== 1 ? "s" : ""}`;

  if (results.length === 0) {
    grid.innerHTML = '<div class="no-results">No results found. Try a different search term.</div>';
    return;
  }

  results.forEach(item => {
    const expl = currentAge === "10" ? item.age10 : item.age45;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <div class="card-name">${URLS[item.name] ? `<a href="${URLS[item.name]}" target="_blank" rel="noopener noreferrer">${item.name} ↗</a>` : item.name}</div>
        <span class="cat-badge ${catClass[item.cat]}">${catLabel[item.cat]}</span>
      </div>
      <div class="card-summary">${item.summary}</div>
      <div class="tags">${item.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <div class="explanation">${expl}</div>
    `;
    grid.appendChild(card);
  });
}

// ── Event Listeners ──────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => {
  currentQuery = e.target.value;
  syncURL();
  render();
});

document.querySelectorAll(".age-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentAge = btn.dataset.age;
    document.querySelectorAll(".age-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    syncURL();
    render();
  });
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentCat = btn.dataset.cat;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    syncURL();
    render();
  });
});

// ── Init ─────────────────────────────────────────────────────
loadFromURL();
render();
</script>
